<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OIS School Bell</title>
<!-- Dastur oynasi, vazifalar paneli va telefon bosh ekranida qo'ng'iroq belgisi ko'rinadi -->
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<script>
  // Sahifa chizilishidan oldin saqlangan mavzu va tilni qo'llash (yonib ketmasligi uchun)
  (function(){
    try{
      var th = localStorage.getItem("ois-theme");
      if(th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
      var lg = localStorage.getItem("ois-lang");
      if(lg === "uz" || lg === "ru" || lg === "en") document.documentElement.lang = lg;
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eef1f0; --panel:#ffffff; --panel-2:#e4e9e7; --line:#d3dbd8;
    --text:#16211f; --text-dim:#54655f;
    --accent:#b8681f; --accent-soft:#f0dcc4;
    --teal:#1f6f6b; --teal-soft:#d9ece9;
    --ok:#2f8a52; --crit:#c2455a;
    --shadow:0 1px 2px rgba(20,30,27,.06),0 8px 24px -12px rgba(20,30,27,.18);
    --radius:26px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1615; --panel:#16201e; --panel-2:#1c2725; --line:#2a3634;
      --text:#e8ede9; --text-dim:#8fa39c;
      --accent:#e3a458; --accent-soft:#3a2f1e;
      --teal:#4fbdb5; --teal-soft:#17302d;
      --ok:#5cbf82; --crit:#e37e8e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -12px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1615; --panel:#16201e; --panel-2:#1c2725; --line:#2a3634;
    --text:#e8ede9; --text-dim:#8fa39c;
    --accent:#e3a458; --accent-soft:#3a2f1e;
    --teal:#4fbdb5; --teal-soft:#17302d;
    --ok:#5cbf82; --crit:#e37e8e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -12px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  /* "hidden" atributi har doim ishlasin (aks holda .panel{display:flex} kabi qoidalar uni bekor qiladi) */
  [hidden]{display:none !important}
  /* Onlayn panel: mikrofon va AI kalitlari faqat maktab kompyuterining o'zida */
  .cloud #announceBtn, .cloud #aiKeysPanel, .cloud body > footer{display:none !important}
  html,body{margin:0;padding:0}
  /* ---------- Scrollbar: brauzerning standart (katta, oq) o'rniga ingichka, mavzuga mos ---------- */
  *{scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background-color:var(--line);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:var(--text-dim)}
  ::-webkit-scrollbar-corner{background:transparent}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:20px 16px 100px; display:flex; flex-direction:column; gap:16px;
    max-width:980px; margin:0 auto; font-variant-numeric:tabular-nums;
  }
  .mono{font-family:'IBM Plex Mono','SF Mono',Menlo,monospace}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .brand{display:flex;gap:12px;align-items:center}
  .bell-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(155deg,var(--accent),#8a4c13);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none}
  .bell-mark svg{width:22px;height:22px}
  .brand h1{font-size:17px;margin:0;font-weight:600}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim)}
  .header-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .toolbar{display:flex;align-items:center;gap:8px}
  .toolbar .seg button{padding:5px 11px;font-size:12px}
  .toolbar{--h:38px}
  .toolbar .seg{height:var(--h)}
  .toolbar .theme-btn{width:var(--h);height:var(--h);padding:0;border-radius:999px}
  .theme-btn svg{width:20px;height:20px}
  .theme-btn .i-sun{display:none}
  :root[data-theme="dark"] .theme-btn .i-sun{display:block}
  :root[data-theme="dark"] .theme-btn .i-moon{display:none}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]) .theme-btn .i-sun{display:block}
    :root:not([data-theme]) .theme-btn .i-moon{display:none}
  }
  .clock-block{text-align:right}
  .clock-block .time{font-size:28px;font-weight:600}
  .clock-block .date{font-size:12.5px;color:var(--text-dim);margin-top:2px}
  .live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);margin-top:4px}
  .live-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
  .live-pill.off{color:var(--crit)}
  .live-pill.off .dot{background:var(--crit);animation:none}
  .banner{background:var(--teal-soft);border:1px solid color-mix(in srgb, var(--teal) 35%, transparent);border-radius:var(--radius);padding:12px 16px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
  .banner b{color:var(--teal)}
  .banner svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--teal)}
  .banner.err{background:color-mix(in srgb, var(--crit) 15%, var(--panel));border-color:color-mix(in srgb, var(--crit) 40%, transparent)}
  .banner.err b,.banner.err svg{color:var(--crit)}
  .seg{display:flex;background:var(--panel-2);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;color:var(--text-dim);font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .playbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:14px;padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .playbtn:hover{border-color:var(--accent)}
  .playbtn:disabled{opacity:.5;cursor:wait}
  .playbtn.live{background:var(--crit);border-color:var(--crit);color:#fff}
  .playbtn.live svg{animation:pulse 1.1s ease-in-out infinite}
  .playbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .icon-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:14px;padding:0 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .icon-btn:hover{border-color:var(--accent)}
  .icon-btn:disabled{opacity:.5;cursor:wait}
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:32px;padding:26px 32px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -20%, var(--accent-soft), transparent 70%);pointer-events:none}
  .hero .left{position:relative;z-index:1}
  .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:600}
  .hero .label{font-size:20px;font-weight:600;margin:6px 0 2px}
  .hero .sub{font-size:13px;color:var(--text-dim)}
  .countdown{position:relative;z-index:1;text-align:right}
  .countdown .num{font-size:44px;font-weight:700;line-height:1}
  .countdown .cap{font-size:12px;color:var(--text-dim);margin-top:4px}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
  .tab{border:none;background:transparent;color:var(--text-dim);font:inherit;font-size:13.5px;font-weight:600;padding:10px 6px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--text)}
  .tabpane{display:flex;flex-direction:column;gap:16px}
  .tabpane[hidden]{display:none}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .panel h2{font-size:13.5px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .panel h2 .count{font-size:11.5px;color:var(--text-dim);font-weight:500}
  .timeline{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow-y:auto}
  .tl-row{display:grid;grid-template-columns:56px 20px 1fr auto;align-items:center;gap:10px;padding:9px 6px;border-radius:14px;font-size:13px}
  .tl-row .t{font-weight:600;color:var(--text-dim)}
  .tl-row .dot{width:8px;height:8px;border-radius:50%;background:var(--line);justify-self:center}
  .tl-row .snd{font-size:11px;color:var(--text-dim)}
  .tl-row.past{opacity:.45}
  .tl-row.now{background:var(--accent-soft)}
  .tl-row.now .t,.tl-row.now .dot{color:var(--accent)}
  .tl-row.now .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent)}
  .tl-row.next .dot{background:var(--teal)}
  .tl-row.next .t{color:var(--teal)}
  .rings-badge{font-size:11.5px;font-weight:600;color:var(--text-dim);background:var(--panel-2);border-radius:999px;padding:2px 8px}
  .tl-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .tl-countdown{font-size:11.5px;color:var(--text-dim);white-space:nowrap}
  .tl-row.now .tl-countdown{color:var(--accent);font-weight:600}
  .log{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
  .log-row{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:7px 8px;border-radius:14px;background:var(--panel-2)}
  .log-row .lt{color:var(--text-dim);font-weight:600;min-width:130px}
  .log-empty{font-size:12.5px;color:var(--text-dim);padding:14px 6px;text-align:center}

  .form-grid{display:flex;flex-direction:column;gap:14px}
  .field-row{display:grid;grid-template-columns:110px 1.5fr 1.4fr;gap:10px;align-items:end}
  .field-row.second{grid-template-columns:1fr 1fr}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field label{font-size:11px;color:var(--text-dim);font-weight:600}
  .field .fhint{font-size:10.5px;color:var(--text-dim)}
  .field input,.field select,.field textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);padding:8px 10px;width:100%}
  .field textarea{resize:vertical;min-height:110px;line-height:1.55}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  /* ---------- AI e'lon ---------- */
  .ai-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ai-row .grow{flex:1}
  .ai-row > .fhint{font-size:11.5px;color:var(--text-dim)}
  .ai-row input[type=text]{flex:1;min-width:180px;width:auto}
  .ai-note{font-size:12.5px;line-height:1.6;color:var(--text-dim);background:var(--accent-soft);border-radius:14px;padding:10px 14px}
  .ai-note b{color:var(--text)}
  .ai-suggest{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .ai-suggest .ai-sug-head{font-size:11px;font-weight:600;color:var(--text-dim)}
  .ai-sug{border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:13px;line-height:1.55;text-align:left;padding:10px 12px;border-radius:14px;cursor:pointer}
  .ai-sug:hover{border-color:var(--accent)}
  .ai-sug.main{border-color:var(--accent)}
  .ai-sel-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:end}
  @media (max-width:720px){ .ai-sel-row{grid-template-columns:1fr} }
  #aiOpPlay svg{width:14px;height:14px}
  #aiOpPlay.loading{animation:pulse 1s ease-in-out infinite}
  .sound-row #aiOpPlay{width:40px}
  .ai-sel-row .sound-row .csel-panel{right:auto;min-width:300px;max-height:320px}
  .ai-vol{flex:1;min-width:180px}
  #aiAudio{width:100%}
  .ai-steps{margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--text-dim)}
  .ai-steps b{color:var(--text)}
  .ai-steps a{color:var(--accent)}
  .key-state{font-weight:600;margin-left:4px}
  .key-state.ok{color:var(--ok)}
  .key-state.no{color:var(--text-dim)}
  .ai-azure summary{cursor:pointer;font-size:12.5px;color:var(--text-dim);font-weight:600;padding:4px 0}
  .ai-azure[open] summary{margin-bottom:10px}
  .ai-row input[type=password]{flex:1;min-width:180px;width:auto}
  a.playbtn{text-decoration:none}
  .sound-row{display:flex;gap:6px}
  .vol-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
  .vol-row .vol-ico{width:16px;height:16px;flex:none;color:var(--text-dim)}
  .field .vol-row input[type=range]{flex:1;min-width:0;padding:0;border:none;background:transparent;accent-color:var(--accent);height:24px;cursor:pointer}
  .vol-val{min-width:44px;text-align:right;font-size:13px;font-weight:600}
  .sound-row select{flex:1;min-width:0}
  .days-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .days-head label{font-size:11px;color:var(--text-dim);font-weight:600}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .preset{border:1px solid var(--line);background:transparent;color:var(--text-dim);font:inherit;font-size:11.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
  .preset:hover{border-color:var(--accent);color:var(--text)}
  .chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .day-chip{border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);font:inherit;font-size:12.5px;font-weight:600;padding:9px 4px;border-radius:14px;cursor:pointer}
  .day-chip:hover{border-color:var(--accent)}
  .day-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .day-chip:disabled{opacity:.5;cursor:wait}
  @media (max-width:720px){
    .field-row{grid-template-columns:1fr 1fr}
  }

  .add-btn{margin-top:16px;border:none;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:filter .12s ease}
  .add-btn:hover{filter:brightness(1.08)}
  .add-btn svg{width:18px;height:18px}
  .fab{position:fixed;left:20px;bottom:20px;z-index:900;height:56px;min-width:56px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:0 10px 28px -8px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 17px;font:inherit;font-size:13.5px;font-weight:600;transition:transform .12s ease,border-color .12s ease}
  .fab:hover{border-color:var(--accent);transform:translateY(-2px)}
  .fab:disabled{opacity:.6;cursor:wait}
  .fab svg{width:22px;height:22px;flex:none}
  .fab.live{background:var(--crit);border-color:var(--crit);color:#fff}
  .fab.live svg{animation:pulse 1.1s ease-in-out infinite}
  .fab:not(.live) .fab-label{display:none}
  dialog.modal{border:none;padding:0;background:transparent;color:var(--text);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:visible}
  dialog.modal::backdrop{background:rgba(8,14,13,.55);backdrop-filter:blur(2px)}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:0 24px 60px -16px rgba(0,0,0,.5);padding:26px 28px 28px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 24px);overflow-y:auto}
  .modal-card:focus{outline:none}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modal-head h2{margin:0;font-size:16px;font-weight:600}
  .modal-close{border:none;background:transparent;color:var(--text-dim);font-size:24px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:14px}
  .modal-close:hover{background:var(--panel-2);color:var(--text)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}
  .modal-actions .playbtn{padding:10px 20px;font-size:13.5px;font-weight:600}
  .modal .banner{margin:0}
  dialog.modal.ask{width:min(440px,calc(100vw - 24px))}
  /* ---------- Kalendar: chapda ixcham oy (sana tanlagich uslubi), o'ngda tanlangan kun ---------- */
  .cal-wrap{display:grid;grid-template-columns:minmax(250px,310px) 1fr;gap:28px;align-items:start}
  .cal-left{display:flex;flex-direction:column;gap:8px}
  .cal-right{display:flex;flex-direction:column;gap:12px;min-width:0;border-left:1px solid var(--line);padding-left:28px;align-self:stretch}
  .cal-right h2{font-size:14px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .cal-right h2 .count{font-size:11.5px;color:var(--text-dim);font-weight:500}
  .cal-head{display:flex;align-items:center;gap:4px}
  .cal-head h2{flex:1;font-size:14.5px;margin:0 0 0 4px}
  .cal-head .grow{display:none}
  .cal-nav{width:32px;height:32px;padding:0;border-radius:50%}
  .cal-nav svg{width:15px;height:15px}
  #calTodayBtn{padding:6px 12px;margin-left:4px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
  .cal-wd{font-size:10.5px;font-weight:600;color:var(--text-dim);text-align:center;padding:4px 0}
  .cal-day{height:42px;border:none;background:none;color:var(--text);font:inherit;cursor:pointer;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .cal-day .num{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;border:1.5px solid transparent;transition:background .12s ease}
  .cal-day:hover .num{background:var(--panel-2)}
  .cal-day .marks{display:flex;gap:3px;height:4px}
  .mk{display:inline-block;width:4px;height:4px;border-radius:50%;flex:none}
  .mk.b{background:var(--text-dim)}
  .mk.e{background:var(--accent)}
  .cal-day.other{opacity:.3}
  .cal-day.past:not(.today):not(.sel){opacity:.5}
  .cal-wd.wknd,.cal-day.wknd .num{color:var(--crit)}
  .cal-day.hol .num{background:color-mix(in srgb, var(--teal) 24%, transparent);color:var(--teal)}
  .cal-day.pub .num{background:color-mix(in srgb, var(--crit) 22%, transparent);color:var(--crit)}
  .lg-pub{background:color-mix(in srgb, var(--crit) 45%, transparent)}
  .pub-toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .pub-toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .pub-head{font-size:11px;font-weight:600;color:var(--text-dim);margin-top:4px}
  .pub-list{display:flex;flex-direction:column;gap:4px}
  .pub-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 10px;border-radius:12px;background:var(--panel-2)}
  .pub-row .pd{font-weight:600;color:var(--crit);min-width:44px}
  .pub-row .pl{flex:1}
  .pub-list.off{opacity:.45}
  .cal-day.today .num{border-color:var(--accent);color:var(--accent)}
  .cal-day.sel .num{background:var(--accent);border-color:var(--accent);color:#fff}
  .cal-day.sel .mk{background:var(--accent)}
  .cal-legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);padding-top:4px;border-top:1px solid var(--line)}
  .cal-legend > span{display:flex;align-items:center;gap:6px;padding-top:6px}
  .cal-legend .mk{width:6px;height:6px}
  .lg{display:inline-block;width:11px;height:11px;border-radius:50%}
  .lg-hol{background:color-mix(in srgb, var(--teal) 45%, transparent)}

  .csel{position:relative}
  .csel-native{display:none}
  .csel-trigger{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text);padding:8px 10px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}

  .csel-trigger.kind-sel{width:auto;font-size:12px}
  .csel-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .csel-chev{flex:none;width:14px;height:14px;opacity:.6;transition:transform .15s ease}
  .csel-trigger[aria-expanded="true"] .csel-chev{transform:rotate(180deg)}
  .csel-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:160px;max-width:min(320px,80vw);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}

  .gate{display:none}

  const LANGS = ["uz","ru","en"];
  const WD_KEYS = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];

  const KINDS = ["bell", "music", "announcement"];

  let lang = "uz";
  try{ const saved = localStorage.getItem("ois-lang"); if(LANGS.includes(saved)) lang = saved; }catch(e){}

  function pluralIndex(n){
    if(lang === "en") return n === 1 ? 0 : 1;
    if(lang === "ru"){
      const m10 = n % 10, m100 = n % 100;
      if(m10 === 1 && m100 !== 11) return 0;
      if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 1;
      return 2;
    }
    return 0;
  }
  function raw(key){
    const v = I18N[lang][key];
    return v !== undefined ? v : I18N.uz[key];
  }
  function t(key, params){
    let v = raw(key);
    if(v === undefined) return key;
    if(Array.isArray(v)) v = v[Math.min(pluralIndex(params && params.n), v.length - 1)];
    return v.replace(/\{(\w+)\}/g, (m, k) => (params && k in params) ? params[k] : m);
  }

  let libraryLocal = [];         // lokal keshdagi kutubxona (server /api/audios)
  let libraryByFile = new Map(); // "library/<id>.mp3" -> yozuv

  function pad(n){ return String(n).padStart(2,"0"); }
  function timeStrToMinutes(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }
  function dateStrOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function weekdayKeyOf(d){ return WD_KEYS[(d.getDay()+6)%7]; }
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseDateStr(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function wdIndex(key){ return WD_KEYS.indexOf(key); }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // ---------- Custom dropdown: <select> ustiga o'z dizayn bilan ochiladigan ro'yxat ----------
  // Asl <select> yashirin holda DOM'da qoladi (.value, .options, "change" hodisasi - hammasi
  // o'zgarmaydi, qolgan kod shu orqali ishlayveradi). Ro'yxat har safar ochilganda select'ning
  // joriy <option>laridan qayta tiklanadi, shuning uchun boshqa joyda innerHTML/value yangilansa ham
  // (masalan ro'yxat qayta yuklanganda) hech narsani qo'lda sinxronlash shart emas.
  const CSEL_ICON_CHEV = '<svg class="csel-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  let openCsel = null; // bir vaqtda faqat bitta ro'yxat ochiq turadi

  function closeCsel(){
    if(!openCsel) return;
    openCsel.panel.hidden = true;
    openCsel.trigger.setAttribute("aria-expanded", "false");
    openCsel = null;
  }

  function refreshCsel(select){
    const c = select._csel;
    if(!c) return;
    const opt = select.options[select.selectedIndex];
    c.labelEl.textContent = opt ? opt.textContent : "";
    c.trigger.disabled = !!select.disabled;
  }

  function buildCselPanel(select){
    const panel = document.createElement("div");
    panel.className = "csel-panel";
    panel.hidden = true;
    panel.setAttribute("role", "listbox");
    let html = "";
    Array.from(select.children).forEach(node=>{
      const opts = node.tagName === "OPTGROUP" ? Array.from(node.children) : [node];
      if(node.tagName === "OPTGROUP") html += `<div class="csel-group">${esc(node.label)}</div>`;
      if(node.tagName !== "OPTGROUP" && node.tagName !== "OPTION") return;
      opts.forEach(opt=>{
        html += `<button type="button" class="csel-opt${opt.selected ? " sel" : ""}" data-value="${esc(opt.value)}" role="option" ${opt.disabled ? "disabled" : ""}>${esc(opt.textContent)}</button>`;
      });
    });
    panel.innerHTML = html;
    return panel;
  }

  function wireCustomSelect(select){
    if(select._csel) return; // allaqachon ulangan
    const originalClass = select.className;
    const wrap = document.createElement("div");
    wrap.className = "csel";
    select.parentNode.insertBefore(wrap, select);
    select.className = "csel-native";
    select.tabIndex = -1;
    wrap.appendChild(select);

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = ("csel-trigger " + originalClass).trim();
    trigger.setAttribute("aria-haspopup", "listbox");
    trigger.setAttribute("aria-expanded", "false");
    trigger.innerHTML = `<span class="csel-label"></span>${CSEL_ICON_CHEV}`;
    wrap.appendChild(trigger);

    const panel = buildCselPanel(select);
    wrap.appendChild(panel);

    select._csel = { wrap, trigger, panel, labelEl: trigger.querySelector(".csel-label") };

    wrap.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(e.target.closest(".csel-trigger")){
        if(openCsel && openCsel.select === select){ closeCsel(); return; }
        closeCsel();
        if(select.disabled) return;
        const fresh = buildCselPanel(select);
        select._csel.panel.replaceWith(fresh);
        select._csel.panel = fresh;
        fresh.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        openCsel = { select, trigger, panel: fresh };
        const sel = fresh.querySelector(".csel-opt.sel");
        if(sel) sel.scrollIntoView({block: "nearest"});
        return;
      }
      const opt = e.target.closest(".csel-opt");
      if(!opt || opt.disabled) return;
      select.value = opt.dataset.value;
      refreshCsel(select);
      closeCsel();
      select.dispatchEvent(new Event("change", {bubbles: true}));
    });

    refreshCsel(select);
  }

  document.addEventListener("click", closeCsel);
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeCsel(); });

  function getBells(){ return (config && config.bells) || []; }

  // Fayl yo'lini (masalan library/<uuid>.mp3) odam o'qiy oladigan nomga aylantiradi

  // Qo'ng'iroq shu sanada chalinadimi (hafta kuni + hafta soni chegarasi)
  function isActiveOn(bell, date){
    if(!(bell.days || []).includes(weekdayKeyOf(date))) return false;
    if(bell.weeks && bell.start_date){
      const diff = Math.round((startOfDay(date) - parseDateStr(bell.start_date)) / 86400000);
      if(diff < 0 || diff >= bell.weeks * 7) return false;
    }
    return true;
  }
  function endDateStr(bell){
    return dateStrOf(addDays(parseDateStr(bell.start_date), bell.weeks * 7 - 1));
  }
  function isExpired(bell, today){
    return !!(bell.weeks && bell.start_date && startOfDay(today) > parseDateStr(endDateStr(bell)));
  }
  function getHolidays(){ return (config && config.holidays) || []; }
  function getEvents(){ return (config && config.events) || []; }
  // Shu sana dam olish kuni / ta'til ichidami (bo'lsa - o'sha yozuv)
  // O'zbekiston davlat bayramlari (serverdagi bell_system/config/uz_holidays.json dan)
  let publicHolidays = {fixed: [], dated: []};
  function pubLabel(h){ return (h.label && (h.label[lang] || h.label.uz)) || ""; }
  function publicHolidaysEnabled(){ return !(config && config.public_holidays === false); }
  function publicHolidayOn(date){
    const d = dateStrOf(date), md = d.slice(5);
    const f = publicHolidays.fixed.find(h => h && h.md === md);
    if(f) return {id: "pub:" + d, start: d, end: d, label: pubLabel(f), public: true, approx: false};
    const x = publicHolidays.dated.find(h => h && h.date === d);
    if(x) return {id: "pub:" + d, start: d, end: d, label: pubLabel(x), public: true, approx: !!x.approx};
    return null;
  }
  async function fetchPublicHolidays(){
    try{
      const r = await api("/api/public-holidays");
      if(r.ok){ const j = await r.json(); publicHolidays = {fixed: j.fixed || [], dated: j.dated || []}; }
    }catch(e){ /* internet/server yo'q - faqat qo'lda kiritilgan dam olish kunlari */ }
  }
  // Dam olish kunimi: avval qo'lda kiritilgan ta'til/dam olish, keyin (yoqilgan bo'lsa) davlat bayrami.
  // (bell_scheduler.py dagi holiday_on() bilan bir xil qoida)
  function holidayOn(date){
    const d = dateStrOf(date);
    const own = getHolidays().find(h => h && h.start <= d && d <= (h.end || h.start));
    if(own) return own;
    return publicHolidaysEnabled() ? publicHolidayOn(date) : null;
  }
  // Shu sanaga qo'yilgan bir martalik qo'ng'iroqlar
  function eventsOn(date){
    const d = dateStrOf(date);
    return getEvents().filter(e => e && e.date === d).map(e => Object.assign({oneTime: true}, e));
  }
  // Shu kuni chalinadigan hamma narsa: dam olish kuni bo'lmasa - haftalik qo'ng'iroqlar, har doim - bir martaliklar
  // (bell_scheduler.py dagi qoida bilan bir xil)
  function bellsOn(date){
    const weekly = holidayOn(date) ? [] : getBells().filter(b => isActiveOn(b, date));
    return weekly.concat(eventsOn(date)).sort((a,b) => a.time.localeCompare(b.time));
  }
  function oneTimeBadge(b){
    return b.oneTime ? `<span class="onetime-badge">${esc(t("oneTimeTag"))}</span>` : "";

  const CMD_TIMEOUT_MS = {ai_tts: 150000, ai_sample: 90000, ai_enhance: 90000, library_sync: 120000};

    return new Response(JSON.stringify(data), {status, headers: {"Content-Type": "application/json"}});
  }
  function cloudErr(e){ return cloudJson(503, {error: String((e && e.message) || e)}); }

  async function cloudState(key){
    const { data, error } = await sb.from("app_state").select("value,version,updated_at").eq("key", key).maybeSingle();
    if(error) throw new Error(error.message);
    return data;
  }

  async function cloudStatus(force){
    if(!force && cloudStatusCache && Date.now() - cloudStatusAt < 4000) return cloudStatusCache;
    const row = await cloudState("status");
    cloudStatusCache = (row && row.value) || {};
    cloudStatusAt = Date.now();
    pcOnline = !!cloudStatusCache.seen_at && Date.now() - new Date(cloudStatusCache.seen_at).getTime() < PC_ONLINE_MS;
    return cloudStatusCache;
  }

  // Maktab kompyuterida bajariladigan buyruq: yozamiz va natijasini kutamiz
  async function cloudCommand(op, payload){
    await cloudStatus();
    if(!pcOnline) throw new Error(t("cloudPcOffline"));
    const { data, error } = await sb.from("commands")
      .insert({op, payload: payload || {}, created_by: sbSession.user.id}).select("id").single();
    if(error) throw new Error(error.message);
    const until = Date.now() + (CMD_TIMEOUT_MS[op] || 30000);
    while(Date.now() < until){
      await new Promise(r => setTimeout(r, 800));
      const res = await sb.from("commands").select("status,result").eq("id", data.id).single();
      if(res.error) continue;
      const c = res.data;
      if(c.status === "done") return c.result || {};
      if(c.status === "error" || c.status === "expired") throw new Error((c.result && c.result.error) || c.status);
    }
    throw new Error(t("cloudCmdTimeout"));
  }

  // Kutubxona ro'yxati to'g'ridan-to'g'ri Supabase'dan (maktab kompyuteri oflayn bo'lsa yoki yangi ovozni
  // hali yuklab olmagan bo'lsa ham nomlar to'g'ri ko'rinadi). Fayl nomi server.js dagi libraryFileName bilan bir xil.
  let cloudLibCache = null, cloudLibAt = 0;
  async function cloudLibrary(){
    if(cloudLibCache && Date.now() - cloudLibAt < 30000) return cloudLibCache;
    const { data, error } = await sb.from("sounds")
      .select("id,name,kind,storage_path,size_bytes,duration_seconds").order("created_at", {ascending: true});
    if(error) throw new Error(error.message);
    cloudLibCache = (data || []).map(r=>({
      id: r.id, name: r.name, kind: r.kind,
      file: "library/" + r.id + (/\.wav$/i.test(r.storage_path || "") ? ".wav" : ".mp3"),
      size: r.size_bytes, duration: r.duration_seconds,
    }));
    cloudLibAt = Date.now();
    return cloudLibCache;
  }

  async function cloudDownload(bucket, path){
    const { data, error } = await sb.storage.from(bucket).download(path);
    if(error) throw new Error(error.message);
    return new Response(data, {status: 200, headers: {"Content-Type": data.type || "audio/wav"}});
  }

  // Jadvalga o'zgarish: o'qish -> qoidani qo'llash -> faqat shu orada boshqa o'zgarish bo'lmagan bo'lsa yozish
  async function cloudMutate(op, body){
    const today = ScheduleCore.todayIn((cloudStatusCache && cloudStatusCache.tz) || "Asia/Tashkent");
    for(let attempt = 0; attempt < 4; attempt++){
      const row = await cloudState("schedule");
      if(!row) return cloudJson(503, {error: t("cloudNoSchedule")});
      const r = ScheduleCore.applyOp(op, row.value, body, today);
      if(r.error) return cloudJson(400, {error: r.error});
      const { data, error } = await sb.from("app_state")
        .update({value: r.config, version: Number(row.version) + 1, updated_at: new Date().toISOString(), updated_by: "online"})
        .eq("key", "schedule").eq("version", row.version).select("version");
      if(error) throw new Error(error.message);
      if(data && data.length) return cloudJson(200, {ok: true, config: r.config});
    }
    return cloudJson(409, {error: t("cloudConflict")});
  }

  async function cloudApi(url, opts){
    const u = new URL(url, location.origin);
    const p = u.pathname;
    const method = (opts.method || "GET").toUpperCase();
    if(!sb || !sbSession) return cloudJson(401, {error: "Avval tizimga kiring"});
    try{
      if(p === "/api/schedule"){
        const row = await cloudState("schedule");
        return row ? cloudJson(200, row.value) : cloudJson(503, {error: t("cloudNoSchedule")});
      }
      const op = p.startsWith("/api/") ? p.slice(5) : "";
      if(method === "POST" && ScheduleCore.OPS.includes(op)) return await cloudMutate(op, JSON.parse(opts.body || "{}"));

      if(p === "/api/log"){
        const st = await cloudStatus();
        return cloudJson(200, {rows: (st.log || []).slice(0, Number(u.searchParams.get("limit") || 50))});
      }
      if(p === "/api/audios"){
        const st = await cloudStatus();
        return cloudJson(200, {files: st.audios || [], library: await cloudLibrary()});
      }
      if(p === "/api/library" && method === "GET"){
        const st = await cloudStatus();
        return cloudJson(200, {sounds: await cloudLibrary(), sync: st.lib_sync || {}});
      }
      if(p === "/api/library/sync"){
        const res = await cloudCommand("library_sync");
        cloudLibAt = 0;
        return cloudJson(200, {...res, sounds: await cloudLibrary()});
      }
      if(p === "/api/public-holidays"){
        const row = await cloudState("public_holidays");
        return cloudJson(200, (row && row.value) || {fixed: [], dated: []});
      }
      // Mikrofon - maktab kompyuterining o'zida; AI kalitlari - faqat o'sha yerda kiritiladi
      if(p === "/api/announce/status") return cloudJson(200, {running: false, error: null});
      if(p.startsWith("/api/announce/") || p === "/api/ai/keys") return cloudJson(400, {error: t("cloudLocalOnly")});

      if(p === "/api/ai/status"){
        const st = await cloudStatus(true);
        return cloudJson(200, st.ai || {});
      }
      if(p === "/api/ai/enhance") return cloudJson(200, await cloudCommand("ai_enhance", JSON.parse(opts.body || "{}")));
      if(p === "/api/ai/tts"){
        const res = await cloudCommand("ai_tts", JSON.parse(opts.body || "{}"));
        return await cloudDownload("transfer", res.path);
      }
      if(p === "/api/ai/sample"){
        const key = u.search;
        if(!cloudSampleCache.has(key)){
          const res = await cloudCommand("ai_sample", {voice: u.searchParams.get("voice"), tone: u.searchParams.get("tone")});
          cloudSampleCache.set(key, res.path);
        }
        return await cloudDownload("transfer", cloudSampleCache.get(key));
      }
      if(p === "/api/ai/play"){
        const path = "play/" + crypto.randomUUID() + ".wav";
        const up = await sb.storage.from("transfer").upload(path, opts.body, {contentType: "audio/wav"});
        if(up.error) throw new Error(up.error.message);
        return cloudJson(200, await cloudCommand("ai_play", {path, volume: Number(u.searchParams.get("volume") || 100)}));
      }
      if(p === "/api/ai/stop") return cloudJson(200, await cloudCommand("ai_stop"));

      // Ovozni oldindan eshitish: kutubxona fayli Supabase'dan, maktab kompyuteridagi boshqa fayllar - yo'q
      if(p.startsWith("/audios/")){
        const file = decodeURIComponent(p.slice("/audios/".length));
        const item = libraryByFile.get(file);
        if(!item) return cloudJson(404, {error: t("cloudLocalOnly")});
        const { data, error } = await sb.from("sounds").select("storage_path").eq("id", item.id).single();
        if(error) throw new Error(error.message);
        return await cloudDownload("sounds", data.storage_path);
      }
      return cloudJson(404, {error: "Noma'lum API yo'li"});
    }catch(e){
      return cloudErr(e);
    }
  }

  async function api(url, opts){
    if(CLOUD) return cloudApi(url, opts || {});
    const o = Object.assign({}, opts);
    o.headers = Object.assign({}, o.headers);
    if(sbSession && sbSession.access_token) o.headers.Authorization = "Bearer " + sbSession.access_token;
    const r = await fetch(url, o);
    if(r.status === 401 && sb && sbSession && !sessionKicked){
      sessionKicked = true;
      sb.auth.signOut({scope: "local"}).catch(()=>{}).finally(()=>{ sessionKicked = false; });
    }
    return r;
  }

  async function apiError(r){
    const j = await r.json().catch(()=>({}));
    return new Error(j.error || ("HTTP " + r.status));
  }
  async function postJson(url, body){
    const r = await api(url, {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
    });
    if(!r.ok) throw await apiError(r);
    const j = await r.json();
    config = j.config;
  }

  async function fetchSchedule(){
    const r = await api("/api/schedule");
    if(!r.ok) throw new Error("schedule fetch: HTTP " + r.status);
    config = await r.json();
  }

  async function fetchLog(){
    const r = await api("/api/log?limit=60");
    if(!r.ok) return [];
    const j = await r.json();
    return j.rows || [];
  }

  const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  function dismissToast(el){

    el.classList.add("out");
    setTimeout(()=>el.remove(), 220);
  }
  function notify(key, params, isErr){
    const html = t(key, params);
    // Bir xil xabar ketma-ket takrorlansa, eskisini almashtiramiz
    toastBox.querySelectorAll(".toast").forEach(el=>{ if(el.dataset.html === html) el.remove(); });

  function renderClock(){

    document.getElementById("hdrTime").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById("hdrDate").textContent = t("dateFmt", {

  function ringsBadge(bell){
    const n = bell.rings || 1;
    return n > 1 ? `<span class="rings-badge mono" title="${esc(t("ringsTitle", {n}))}">&times;${n}</span>` : "";
  }
  // 100% dan past ovoz balandligi bo'lsa, ro'yxatda kichik belgi ko'rsatiladi
  function volumeBadge(bell){
    const n = bell.volume;
    return n && n < 100 ? `<span class="rings-badge mono" title="${esc(t("volumeTitle", {n}))}">${n}%</span>` : "";
  }

  // Keyingi qo'ng'iroqni bugundan boshlab LOOKAHEAD_DAYS kun ichidan qidiradi.
  // "diff" - qolgan vaqt, SONIYALARDA (soat:daqiqa:soniya ko'rinishida chiqarish uchun).
  function findNextBell(now){
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    for(let off = 0; off < LOOKAHEAD_DAYS; off++){
      const day = addDays(now, off);
      const list = bellsOn(day).filter(b => off > 0 || timeStrToMinutes(b.time)*60 > nowSec);
      if(list.length) return { bell: list[0], off, diff: off*86400 + timeStrToMinutes(list[0].time)*60 - nowSec, day };
    }
    return null;
  }

  // Soniyalarni "H:MM:SS" ko'rinishiga o'tkazadi (soat, daqiqa, soniya - hammasi ko'rinadi)
  function fmtCountdown(totalSec){
    const s = Math.max(0, Math.round(totalSec));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return `${h}:${pad(m)}:${pad(sec)}`;
  }

  // Qo'ng'iroq taxminan necha soniya chalinadi (rings marta ketma-ket, bell_scheduler.py orasida tanaffussiz chaladi).
  // Kutubxonadagi ovozlar uchun aniq davomiylik bor; lokal (audios/) fayllar uchun - taxminiy standart qiymat.
  function ringDurationSec(bell){
    const entry = libraryByFile.get(bell.sound);
    const one = (entry && entry.duration != null && entry.duration > 0) ? Number(entry.duration) : DEFAULT_RING_SEC;
    return one * Math.max(1, bell.rings || 1);
  }

  function renderMain(){
    if(!config) return;
    const now = new Date();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    const events = bellsOn(now);

    const tl = document.getElementById("timeline");
    tl.innerHTML = "";
    document.getElementById("tlCount").textContent = events.length ? t("nBells", {n: events.length}) : "";
    const todayHol = holidayOn(now);
    if(todayHol) tl.insertAdjacentHTML("beforeend", `<div class="ai-note">${t("todayHoliday", {label: esc(todayHol.label)})}</div>`);
    if(!events.length){
      tl.insertAdjacentHTML("beforeend", `<div class="log-empty">${t("noBellsToday")}</div>`);
    }

    // Har bir hodisa uchun: hali kelmagan (kutilmoqda) / hozir chalinmoqda (taxminiy davomiyligi ichida) /
    // allaqachon chalinib bo'lgan - shu orqali "hozir" belgisi butun daqiqa emas, faqat ovoz davomicha turadi.
    let nowEvent = null, nextRow = null, foundNext = false;
    events.forEach(ev=>{
      const evSec = timeStrToMinutes(ev.time) * 60;
      const elapsed = nowSec - evSec;
      const dur = ringDurationSec(ev);
      const playing = elapsed >= 0 && elapsed < dur;
      const past = elapsed >= dur;
      const row = document.createElement("div");
      let cls = "tl-row";
      if(past) cls += " past";
      if(playing){ cls += " now"; if(!nowEvent) nowEvent = ev; }
      row.className = cls;
      if(ScheduleCore.COLORS.includes(ev.color)) row.dataset.color = ev.color;
      // Har bir qatorda ham o'sha qo'ng'iroqgacha qolgan vaqt (yoki "chalinmoqda") ko'rsatiladi
      const countdown = playing ? `<span class="tl-countdown">${t("tlPlaying")}</span>`
        : past ? ""
        : `<span class="tl-countdown mono">${fmtCountdown(-elapsed)}</span>`;
      row.innerHTML = `<div class="t mono">${esc(ev.time)}</div><div class="dot"></div>
        <div><div>${esc(ev.label)}</div><div class="snd mono">${esc(soundLabel(ev.sound))}</div></div>
        <div class="tl-right">${oneTimeBadge(ev)}${ringsBadge(ev)}${volumeBadge(ev)}${countdown}</div>`;
      tl.appendChild(row);
      if(elapsed < 0 && !foundNext){ foundNext = true; nextRow = row; }
    });
    if(nextRow) nextRow.classList.add("next");

    const heroLabel = document.getElementById("heroLabel");
    const heroSub = document.getElementById("heroSub");
    const heroCountdown = document.getElementById("heroCountdown");
    const heroEyebrow = document.getElementById("heroEyebrow");

    const next = nowEvent ? null : findNextBell(now);
    if(nowEvent){
      heroEyebrow.textContent = t("eyebrowNow");
      heroLabel.textContent = nowEvent.label;
      heroSub.textContent = nowEvent.time + " · " + soundLabel(nowEvent.sound);
      heroCountdown.textContent = "♪ ♪ ♪";
      heroCountdown.classList.add("pulse");
    } else if(next){
      heroEyebrow.textContent = t("eyebrowNext");
      heroLabel.textContent = next.bell.label;
      // Bugun - hech narsa; shu hafta ichida - hafta kuni; undan uzoqda (masalan ta'tildan keyin) - sana
      const when = next.off === 0 ? ""
        : next.off < 7 ? raw("wdFull")[wdIndex(weekdayKeyOf(next.day))] + " · "
        : fmtDateHuman(dateStrOf(next.day)) + " · ";
      heroSub.textContent = when + next.bell.time + " · " + soundLabel(next.bell.sound);
      heroCountdown.textContent = fmtCountdown(next.diff);
      heroCountdown.classList.remove("pulse");
    } else {
      heroEyebrow.textContent = t("eyebrowNone");
      heroLabel.textContent = t(getBells().length ? "labelNoUpcoming" : "labelEmpty");
      heroSub.textContent = "";
      heroCountdown.textContent = "—";
      heroCountdown.classList.remove("pulse");
    }
  }

  // ---------- Tasdiqlash / so'rash oynasi ----------
  // Brauzerning confirm()/prompt() oynalari ba'zi brauzerlarda (masalan ilova ichidagi) ishlamaydi va
  // dizaynga mos emas - shuning uchun o'zimizning oynamiz. Natija: Promise (true/false yoki kiritilgan matn/null).
  const askDialog = document.getElementById("askDialog");

  const ICON_ASK_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  let askResolve = null;

  // html - tayyor (xavfsiz qilingan) HTML; input - matn so'ralsa boshlang'ich qiymat
  function askBox({title, html, okLabel, danger = false, input = null}){
    if(askResolve) closeAsk(null);
    return new Promise(resolve=>{
      askResolve = resolve;
      askTitle.textContent = title;
      askText.innerHTML = html || "";

      if(input !== null){ askInput.focus(); askInput.select(); }
      else askCancel.focus(); // xavfsiz tanlov: Enter tasodifan "o'chirish" ni bosmasin
    });
  }
  function closeAsk(result){
    if(askDialog.open) askDialog.close();
    if(askResolve){ const r = askResolve; askResolve = null; r(result); }
  }
  const askNo = ()=> closeAsk(askField.hidden ? false : null);
  askOk.addEventListener("click", ()=> closeAsk(askField.hidden ? true : askInput.value));
  askCancel.addEventListener("click", askNo);
  askDialog.addEventListener("cancel", (e)=>{ e.preventDefault(); askNo(); });                 // Esc
  askDialog.addEventListener("mousedown", (e)=>{ if(e.target === askDialog) askNo(); });       // fonni bosish
  askInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); askOk.click(); } });

  // Ro'yxatda qatorni bosib tanlang, Ctrl+C - nusxalanadi. Ctrl+V - shu qo'ng'iroq ma'lumotlari bilan
  // "Yangi qo'ng'iroq" oynasi darhol ochiladi (odatda faqat vaqtni o'zgartirib saqlash kifoya).
  // Nusxa tizim buferiga yoziladi, shuning uchun lokal paneldan onlayn panelga ham qo'yish mumkin.
  const BELL_CLIP_TYPE = "ois-school-bell/bell";
  let selectedBellId = null;

  function selectBell(id){
    selectedBellId = id;
    document.querySelectorAll("#bellList .bell-row").forEach(r=>r.classList.toggle("selected", !!id && r.dataset.id === id));
  }
  // Matn yozilayotgan joyda yoki oyna ochiq bo'lsa - oddiy Ctrl+C / Ctrl+V ishlaydi
  function clipboardBusy(){
    const a = document.activeElement;
    return !!(a && a.closest && a.closest("input, textarea, select, [contenteditable]")) || !!document.querySelector("dialog[open]");
  }
  document.addEventListener("mousedown", (e)=>{
    if(selectedBellId && !e.target.closest("#bellList .bell-row, dialog, .toast")) selectBell(null);
  });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && selectedBellId && !clipboardBusy()) selectBell(null); });

  let copiedBell = null;   // shu oynada oxirgi nusxalangan qo'ng'iroq
  let pasteFallback = null;

  function selectedBellData(){
    const b = selectedBellId && getBells().find(x=>x.id === selectedBellId);
    return b ? {type: BELL_CLIP_TYPE, time: b.time, label: b.label, sound: b.sound,
                days: b.days || [], rings: b.rings || 1, volume: b.volume || 100, weeks: b.weeks || null,
                color: b.color || null} : null;
  }
  function openPastedBell(data){
    if(document.querySelector("dialog[open]")) return;

    fillBellForm(data);

    notify("okBellPasted", null, false);

  document.addEventListener("keydown", (e)=>{
    if(!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey || !authed || clipboardBusy()) return;
    const k = e.key.toLowerCase();
    if((k === "c" || e.code === "KeyC") && !String(window.getSelection() || "").trim()){
      const data = selectedBellData();
      if(!data) return;
      copiedBell = data;
      // Tizim buferiga ham (boshqa oynadagi - masalan onlayn - panelga qo'yish uchun); bo'lmasa - shu oyna ichida ishlaydi
      try{ navigator.clipboard.writeText(JSON.stringify(data)).catch(()=>{}); }catch(err){ /* bufer yopiq */ }
      notify("okBellCopied", {time: esc(data.time), label: esc(data.label)}, false);
    } else if(k === "v" || e.code === "KeyV"){
      // Avval "paste" hodisasini kutamiz (unda tizim buferidagi nusxa bor); kelmasa - shu oynadagi nusxa
      clearTimeout(pasteFallback);
      pasteFallback = setTimeout(()=>{ if(copiedBell) openPastedBell(copiedBell); }, 120);
    }

  document.addEventListener("copy", (e)=>{
    if(clipboardBusy() || String(window.getSelection() || "").trim()) return;
    const data = selectedBellData();
    if(!data) return;
    e.clipboardData.setData("text/plain", JSON.stringify(data));
    e.preventDefault();
  });

  document.addEventListener("paste", (e)=>{
    if(!authed || clipboardBusy()) return;
    clearTimeout(pasteFallback);
    const text = e.clipboardData.getData("text/plain");
    let data = null;
    try{
      const o = JSON.parse(text);
      if(o && o.type === BELL_CLIP_TYPE && typeof o.time === "string") data = o;
    }catch(err){ /* buferda boshqa narsa */ }
    if(!data && !text && copiedBell) data = copiedBell;
    if(!data) return;   // buferda boshqa matn - foydalanuvchi boshqa narsa nusxalagan
    e.preventDefault();
    openPastedBell(data);
  });

  // ---------- vaqt tanlagich (aylanadigan g'ildirak) ----------
  const ROW = 44;

  const tpItems = (n) => Array.from({length: n}, (_, i) =>
    `<button type="button" class="tp-item" role="option" tabindex="-1" data-i="${i}">${pad(i)}</button>`).join("");
  tpHours.innerHTML = tpItems(24);

  const tpTimers = new WeakMap();

  function wheelIndex(w){
    return Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / ROW)));
  }
  // Markazdan uzoqlashgan sari raqam kichrayadi va xiralashadi
  function styleWheel(w){
    const pos = w.scrollTop / ROW;
    for(let i = 0; i < w.children.length; i++){
      const d = Math.min(Math.abs(i - pos), 3);
      const el = w.children[i];
      el.style.opacity = Math.max(0.12, 1 - d * 0.5).toFixed(2);
      el.style.transform = `scale(${(1 - Math.min(d, 2) * 0.2).toFixed(3)})`;
      el.style.fontWeight = d < 0.5 ? "500" : "300";
    }
  }
  function tpCommit(){
    bellTime.value = pad(wheelIndex(tpHours)) + ":" + pad(wheelIndex(tpMins));
  }
  function tpSetWheels(h, m){
    tpHours.scrollTop = h * ROW;
    tpMins.scrollTop = m * ROW;
    styleWheel(tpHours); styleWheel(tpMins);
  }
  function openTimePop(){
    const m = /^(\d\d):(\d\d)$/.exec(bellTime.value);

  // Popover kartaning ichida qirqilib qolmasligi uchun ekranga nisbatan joylanadi
  function placeTimePop(){
    const r = bellTime.getBoundingClientRect();
    const w = tpPop.offsetWidth, h = tpPop.offsetHeight, gap = 8, edge = 12;
    let top = r.bottom + gap;
    if(top + h > window.innerHeight - edge) top = r.top - h - gap;
    top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));
    const left = Math.max(edge, Math.min(r.left, window.innerWidth - w - edge));
    tpPop.style.top = top + "px";
    tpPop.style.left = left + "px";
  }
  function closeTimePop(){ tpPop.hidden = true; }

  [tpHours, tpMins].forEach(w=>{
    w.addEventListener("scroll", ()=>{
      if(!tpFrames.get(w)){
        tpFrames.set(w, requestAnimationFrame(()=>{ tpFrames.set(w, 0); styleWheel(w); }));
      }
      // Aylantirish to'xtagach qiymatni yozamiz
      clearTimeout(tpTimers.get(w));
      tpTimers.set(w, setTimeout(()=>{ if(tpTouched) tpCommit(); }, 120));
    }, {passive: true});
    ["pointerdown", "wheel", "keydown", "touchstart"].forEach(ev=>
      w.addEventListener(ev, ()=>{ tpTouched = true; }, {passive: true}));
    w.addEventListener("click", (e)=>{
      const b = e.target.closest(".tp-item"); if(!b) return;

  });

  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // ko'rsatilayotgan oyning 1-kuni
  let calSel = dateStrOf(new Date());                                           // tanlangan kun (YYYY-MM-DD)

  function fmtDateHuman(dstr){
    const d = parseDateStr(dstr);
    return d.getDate() + " " + raw("months")[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
  }
  function fmtShortDate(dstr){ const d = parseDateStr(dstr); return pad(d.getDate()) + "." + pad(d.getMonth() + 1); }
  function holRange(h){ const e = h.end || h.start; return h.start === e ? fmtDateHuman(h.start) : fmtDateHuman(h.start) + " – " + fmtDateHuman(e); }
  function holDays(h){ return Math.round((parseDateStr(h.end || h.start) - parseDateStr(h.start)) / 86400000) + 1; }

  function renderCalendar(){
    if(!config) return;
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    calTitle.textContent = raw("monthsNom")[m] + " " + y;
    const first = new Date(y, m, 1);
    const lead = (first.getDay() + 6) % 7;                 // hafta dushanbadan boshlanadi
    const cells = Math.ceil((lead + new Date(y, m + 1, 0).getDate()) / 7) * 7;
    const todayStr = dateStrOf(new Date());
    let html = raw("wdShort").map((w, i)=>`<div class="cal-wd${i >= 5 ? " wknd" : ""}">${esc(w)}</div>`).join("");
    for(let i = 0; i < cells; i++){
      const d = addDays(first, i - lead);
      const ds = dateStrOf(d);
      const hol = holidayOn(d);
      const list = bellsOn(d);
      const cls = ["cal-day"];
      if(d.getMonth() !== m) cls.push("other");
      if(d.getDay() === 0 || d.getDay() === 6) cls.push("wknd");   // shanba, yakshanba
      if(ds === todayStr) cls.push("today");
      else if(ds < todayStr) cls.push("past");
      if(ds === calSel) cls.push("sel");

      // Nuqtalar: kulrang - jadvaldagi qo'ng'iroqlar bor, to'q sariq - bir martalik qo'ng'iroq bor

  async function fetchAnnounceStatus(){

    return r.json();
  }

  function renderAnnounceBtn(){

  async function pollAnnounceStatus(){
    try{
      const st = await fetchAnnounceStatus();
      announceRunning = !!st.running;
      if(st.error && st.error !== lastAnnounceError) notify("annErr", {msg: esc(st.error)}, true);
      lastAnnounceError = st.error || null;
      if(!announceBusy) renderAnnounceBtn();
    }catch(e){ /* jim */ }
  }

  announceBtn.addEventListener("click", async ()=>{
    announceBusy = true; renderAnnounceBtn();

        ? await (await api("/api/announce/stop", {method:"POST"})).json()
        : await (await api("/api/announce/start", {method:"POST"})).json();

      lastAnnounceError = st.error || null;

  const gateBody = document.getElementById("gateBody");

  // "admin" -> "admin@bell.local". Bu domen hech qayerda ko'rsatilmaydi va xat yuborilmaydi.
  const LOGIN_DOMAIN = "@bell.local";
  const USERNAME_RE = /^[a-z0-9][a-z0-9._-]{1,31}$/;
  function usernameToEmail(u){
    const name = String(u || "").trim().toLowerCase();
    return USERNAME_RE.test(name) ? name + LOGIN_DOMAIN : null;

  async function applyAuthState(){

      authed = false;
      setLocked(true);

  async function initSupabase(){
    try{
      const cfg = CLOUD ? {enabled: true, url: CLOUD.url, anonKey: CLOUD.anonKey} : await (await fetch("/api/config")).json();
      sbEnabled = !!cfg.enabled;
      if(sbEnabled && window.supabase){
        sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, storageKey: "ois-sb-auth" }
        });
        const { data } = await sb.auth.getSession();
        sbSession = data.session;
        sb.auth.onAuthStateChange((ev, session)=>{
          sbSession = session;
          if(ev === "TOKEN_REFRESHED" || ev === "USER_UPDATED") return; // holat o'zgarmaydi, faqat token yangilandi
          setTimeout(applyAuthState, 0);
        });
      }
    }catch(e){ /* server yoki internet yo'q */ }
    sbInitDone = true;
    await applyAuthState();

  function renderGate(){

    if(!sbEnabled){ renderSetupGate(); return; }
    if(!sb){ gateBody.innerHTML = `<div class="acc-note">${t("accNoLib")}</div>`; return; }
    // Parol maydoni qayta chizilib, yozilayotgan matn yo'qolmasligi uchun (til almashganda) oldingi qiymatlarni saqlaymiz
    const prevEmail = (document.getElementById("loginEmail") || {}).value || "";
    gateBody.innerHTML = `<form class="gate-form" id="loginForm">
        <h2>${t("loginTitle")}</h2>
        <div class="field"><label for="loginEmail">${t("accUsername")}</label><input type="text" id="loginEmail" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus></div>
        <div class="field"><label for="loginPass">${t("accPassword")}</label><input type="password" id="loginPass" autocomplete="current-password" required></div>
        <button type="submit" class="playbtn primary" id="loginBtn">${t("accLoginBtn")}</button>
      </form>`;
    document.getElementById("loginEmail").value = prevEmail;
    document.getElementById("loginForm").addEventListener("submit", async (e)=>{

      try{
        const email = usernameToEmail(document.getElementById("loginEmail").value);
        const { error } = email
          ? await sb.auth.signInWithPassword({ email, password: document.getElementById("loginPass").value })

        if(error){
          if(/invalid|credentials/i.test(error.message)) notify("errLogin", null, true);

          else notify("errMsg", {msg: esc(error.message)}, true);
          const pass = document.getElementById("loginPass");
          if(pass){ pass.value = ""; pass.focus(); }
        }
      }finally{
        btn.disabled = false;
      }
    });
  }

  function audioDuration(file){
    return new Promise(resolve=>{
      const a = new Audio();
      const url = URL.createObjectURL(file);
      const done = (v)=>{ URL.revokeObjectURL(url); resolve(v); };
      a.preload = "metadata";
      a.onloadedmetadata = ()=>done(isFinite(a.duration) ? Math.round(a.duration * 100) / 100 : null);
      a.onerror = ()=>done(null);
      setTimeout(()=>done(null), 4000);
      a.src = url;
    });
  }

  // opts.kind - turini majburan belgilash (masalan AI e'lon -> "announcement"); bo'lmasa - toolbardagi tanlov
  async function uploadSounds(files, opts){
    if(!sb || !sbSession || !files.length) return 0;
    const kind = (opts && opts.kind) || libKindSel.value || "music";
    let ok = 0;
    for(let i = 0; i < files.length; i++){
      const f = files[i];
      if(!/\.(mp3|wav)$/i.test(f.name)){ notify("errMsg", {msg: t("errFileType", {name: esc(f.name)})}, true); continue; }
      if(f.size > MAX_LIB_BYTES){ notify("errMsg", {msg: t("errFileSize", {name: esc(f.name)})}, true); continue; }
      libBusy = t("libUploading", {i: i + 1, n: files.length, name: f.name});
      renderLibStatus(); libUploadBtn.disabled = true;
      let uploadedPath = null;
      try{
        const id = crypto.randomUUID();
        const ext = /\.wav$/i.test(f.name) ? "wav" : "mp3";
        const now = new Date();
        const path = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${id}.${ext}`;
        const contentType = ext === "wav" ? "audio/wav" : "audio/mpeg";
        const duration = await audioDuration(f);
        const up = await sb.storage.from("sounds").upload(path, f, {contentType, upsert: false});
        if(up.error) throw up.error;
        uploadedPath = path;
        const ins = await sb.from("sounds").insert({
          id, name: f.name.replace(/\.[^.]+$/, ""), kind, storage_path: path,
          mime_type: contentType, size_bytes: f.size, duration_seconds: duration
        });
        if(ins.error) throw ins.error;
        ok++;
      }catch(e){
        if(uploadedPath) await sb.storage.from("sounds").remove([uploadedPath]).catch(()=>{});
        notify("errMsg", {msg: esc(f.name) + ": " + esc((e && e.message) || String(e))}, true);
      }
    }
    libBusy = "";
    if(ok) notify("okUploaded", {n: ok}, false);
    await loadSounds();
    if(ok) syncLocalLibrary();
    return ok;
  }

  // Istalgan audio (wav/mp3) -> 24 kHz mono namunalar
  async function decodeMono(arrayBuffer){
    const ctx = new OfflineAudioContext(1, 1, AI_SR);
    const ab = await ctx.decodeAudioData(arrayBuffer);
    const out = new Float32Array(ab.length);
    for(let c = 0; c < ab.numberOfChannels; c++){
      const d = ab.getChannelData(c);
      for(let i = 0; i < d.length; i++) out[i] += d[i] / ab.numberOfChannels;
    }
    return out;
  }

  async function loadIntro(value){
    if(!value || !value.startsWith("file:")) return null;
    const file = value.slice(5);
    const r = await api("/audios/" + file.split("/").map(encodeURIComponent).join("/"));
    if(!r.ok) throw new Error("HTTP " + r.status);
    let pcm = await decodeMono(await r.arrayBuffer());
    const max = AI_INTRO_MAX_SEC * AI_SR;
    if(pcm.length > max){
      pcm = pcm.slice(0, max);
      for(let i = 0; i < AI_SR; i++) pcm[max - AI_SR + i] *= 1 - i / AI_SR; // oxirgi 1 soniyada asta pasayadi
    }
    return pcm;
  }

  function encodeWav(samples){
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (o, s)=>{ for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, AI_SR, true); v.setUint32(28, AI_SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, samples.length * 2, true);
    for(let i = 0; i < samples.length; i++){
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], {type: "audio/wav"});
  }

  // Signal + 0.35 s jimlik + ovoz + 0.3 s jimlik -> bitta WAV (chegaradan oshsa, umumiy pasaytiriladi)
  function joinParts(intro, speech){
    const introLen = intro ? intro.length : 0;
    const gap = intro ? Math.round(0.35 * AI_SR) : 0;
    const out = new Float32Array(introLen + gap + speech.length + Math.round(0.3 * AI_SR));
    if(intro) out.set(intro, 0);
    out.set(speech, introLen + gap);
    let peak = 0;
    for(let i = 0; i < out.length; i++) peak = Math.max(peak, Math.abs(out[i]));
    if(peak > 0.98){ const k = 0.98 / peak; for(let i = 0; i < out.length; i++) out[i] *= k; }
    return encodeWav(out);
  }

    aiKeysSave.disabled = true;
    try{
      const r = await api("/api/ai/keys", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      if(!r.ok) throw await apiError(r);
      aiConf = await r.json();
      Object.values(keyInputs).forEach(id=>{ document.getElementById(id).value = ""; });
      notify("okAiKeys", null, false);
    }catch(e){ notifyError(e); }
    aiKeysSave.disabled = false;
    renderAiConf();
  });

  aiStopBtn.addEventListener("click", async ()=>{
    try{
      const r = await api("/api/ai/stop", {method: "POST"});
      if(r.ok) aiConf = Object.assign(aiConf || {}, await r.json());
    }catch(e){ notifyError(e); }
    renderAiConf();
  });

  // Kirilmaguncha hech qanday so'rov yuborilmaydi
  setInterval(()=>{ if(authed){ renderMain(); renderClock(); } }, 1000);
  setInterval(()=>{ if(authed) pollSchedule(); }, 4000);
  setInterval(()=>{ if(authed) pollLog(); }, 3000);

  (async function init(){
    applyLang();
    await initSupabase();   // admin bo'lsa panelni ochadi (startApp), bo'lmasa kirish ekranini ko'rsatadi
  })();
})();
</script>
</body>
</html>
